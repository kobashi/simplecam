<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Camera Frame Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="preview-shell" aria-label="camera preview">
        <div class="preview-stage">
          <video
            id="camera"
            class="camera-feed"
            autoplay
            muted
            playsinline
            webkit-playsinline="true"
          ></video>
          <canvas
            id="filteredPreview"
            class="filtered-preview is-hidden"
            aria-hidden="true"
          ></canvas>
          <div class="preview-vignette" aria-hidden="true"></div>
          <div id="gestureSurface" class="gesture-surface" aria-hidden="true"></div>
        </div>
        <div class="trail-controls" aria-label="filter controls">
          <label class="trail-slider">
            <span class="trail-slider-label">DELAY</span>
            <input
              id="trailDelaySlider"
              class="trail-slider-input"
              type="range"
              min="0"
              max="2000"
              step="10"
              value="0"
            />
            <span id="trailDelayValue" class="trail-slider-value">0</span>
          </label>
          <label class="trail-slider">
            <span class="trail-slider-label">CONTRAST</span>
            <input
              id="contrastThresholdSlider"
              class="trail-slider-input"
              type="range"
              min="0"
              max="255"
              step="1"
              value="0"
            />
            <span id="contrastThresholdValue" class="trail-slider-value">0</span>
          </label>
          <label class="trail-slider">
            <span class="trail-slider-label">TRAIL</span>
            <input
              id="trailAmountSlider"
              class="trail-slider-input"
              type="range"
              min="0"
              max="2000"
              step="10"
              value="0"
            />
            <span id="trailAmountValue" class="trail-slider-value">0</span>
          </label>
          <label class="trail-slider">
            <span class="trail-slider-label">THRESH</span>
            <input
              id="audioThresholdSlider"
              class="trail-slider-input"
              type="range"
              min="0"
              max="100"
              step="1"
              value="12"
            />
            <span id="audioThresholdValue" class="trail-slider-value">12</span>
          </label>
          <label class="trail-slider">
            <span class="trail-slider-label">REL</span>
            <input
              id="audioReleaseSlider"
              class="trail-slider-input"
              type="range"
              min="20"
              max="2000"
              step="10"
              value="350"
            />
            <span id="audioReleaseValue" class="trail-slider-value">350</span>
          </label>
          <label class="trail-slider">
            <span class="trail-slider-label">OCT</span>
            <input
              id="audioOctaveSlider"
              class="trail-slider-input"
              type="range"
              min="-2"
              max="2"
              step="1"
              value="0"
            />
            <span id="audioOctaveValue" class="trail-slider-value">0</span>
          </label>
        </div>
        <button
          id="controlsToggle"
          class="controls-toggle"
          type="button"
          aria-label="Toggle controls visibility"
          aria-pressed="true"
        >
          UI ON
        </button>
        <div class="top-controls">
          <button
            id="audioToggle"
            class="audio-toggle"
            type="button"
            aria-label="Toggle synthesized audio"
            aria-pressed="false"
          >
            SND OFF
          </button>
          <button
            id="audioEnvelopeToggle"
            class="audio-envelope-toggle"
            type="button"
            aria-label="Toggle audio envelope"
            aria-pressed="false"
          >
            ENV OFF
          </button>
          <button
            id="cameraToggle"
            class="camera-toggle is-hidden"
            type="button"
            aria-label="Toggle camera"
          >
            REAR
          </button>
          <button
            id="fullscreenToggle"
            class="fullscreen-toggle"
            type="button"
            aria-label="Toggle fullscreen"
          >
            FULL
          </button>
        </div>
        <div class="status-panel is-hidden" id="statusPanel" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="./app.js?v=ui-audio-octave-1"></script>
  </body>
</html>
